<!doctype html>
<html lang="zh-TW" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: http: chrome-extension:; connect-src 'self'"
    />
    <title>AxonDeck 瀏覽器</title>
    <link rel="stylesheet" href="../styles/themes.css" />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <!-- 只有工具列：網頁是 main 疊在下面的 WebContentsView（main/browser-window.js，高度對齊 BAR_HEIGHT） -->
  <body class="bw-body">
    <div class="ws-browser-bar bw-bar">
      <button type="button" id="bwBack" class="btn-icon" title="上一頁" aria-label="上一頁" disabled>←</button>
      <button type="button" id="bwFwd" class="btn-icon" title="下一頁" aria-label="下一頁" disabled>→</button>
      <button type="button" id="bwReload" class="btn-icon" title="重新整理 (F5)" aria-label="重新整理">⟳</button>
      <input type="text" id="bwUrl" class="input input-sm ws-browser-url" placeholder="輸入網址後按 Enter" aria-label="網址" />
      <div id="bwActions" class="ws-browser-actions" role="group" aria-label="擴充功能圖示" hidden></div>
      <button type="button" id="bwExt" class="btn-icon" title="擴充功能" aria-label="擴充功能">🧩</button>
    </div>
    <script type="module" src="../scripts/browser-window.js"></script>
  </body>
</html>
